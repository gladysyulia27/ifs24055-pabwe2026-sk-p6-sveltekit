<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delcom Courses</title>
    <meta
      name="description"
      content="Delcom Courses: platform pembelajaran kursus dan materi online modern. Kelola kursus, materi, dan profil belajar kamu dalam satu tempat."
    />
    <!-- Font dimuat tanpa memblokir render (media=print lalu diganti ke all saat selesai) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    %sveltekit.head%
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
